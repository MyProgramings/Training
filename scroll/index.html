<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #161616;
        }

        .img {
            width: 100%;
            height: 100vh;
            background: url(https://i.imgur.com/aGromZ6.png) no-repeat 50% 50%;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #smooth-content {
            will-change: transform;
        }

        .text>h1 {
            max-width: 90vw;
            margin: auto;
            line-height: 1.2;
            font-size: 60px;
            color: rgb(255, 255, 255);
        }

        .text {
            padding: 10vh 0;
        }

        .mask {
            width: 100%;
            height: 115%;
            position: absolute;
            background: #161616;
            left: 0;
            top: 0;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="smooth-wrapper">
        <div id="smooth-content">
            <div class="img">

            </div>

            <div class="text">
                <h1>هناك حقيقة مثبتة منذ زمن طويل وهي أن المحتوى المقروء لصفحة ما سيلهي
                    القارئ عن التركيز على الشكل الخارجي للنص أو شكل توضع الفقرات في الصفحة التي يقرأها.
                    ولذلك يتم استخدام. </h1>
            </div>

            <div class="img">

            </div>
        </div>
    </div>
    <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
    <script src="https://assets.codepen.io/16327/ScrollSmoother.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>
    <script>
        gsap.config({ trialWarn: false });
        console.clear();
        gsap.registerPlugin(ScrollTrigger, SplitText, ScrollSmoother);
        let smoother = ScrollSmoother.create({
            smooth: 2
        });

        let split = new SplitText("h1", { type: "lines" });
        let masks;
        function makeItHappen() {
            masks = [];
            split.lines.forEach((target) => {
                let mask = document.createElement("span");
                mask.className = "mask";
                target.append(mask);
                masks.push(mask);
                gsap.to(mask, {
                    scaleX: 0,
                    transformOrigin: "left center",
                    ease: "none",
                    scrollTrigger: {
                        trigger: target,
                        markers: {
                            startColor: "white",
                            endColor: "#42a6e0",
                            fontSize: "12px",
                            indent: 10
                        },
                        scrub: true,
                        start: "top center",
                        end: "bottom center"
                    }
                });
            });
        }

        window.addEventListener("resize", newTriggers);

        function newTriggers() {
            ScrollTrigger.getAll().forEach((trigger, i) => {
                trigger.kill();
                masks[i].remove();
            });
            split.split();
            makeItHappen();
        }

        makeItHappen();
    </script>
</body>

</html>
